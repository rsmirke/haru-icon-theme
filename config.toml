# haru settings.
# Your personal copy lives in ~/.config/haru/config.toml (made by install.sh).
# Edit that one, then run:  ~/.local/share/haru/haru.py generate

# Apps to leave completely alone (desktop id without .desktop, or icon name).
skip = []

[theme]
# "auto" follows the Yaru variant you had active when you installed (e.g. Yaru-blue-dark).
base = "auto"

[shape]
plate = 0.875           # plate side as a fraction of the icon canvas (56 px in a 64 px cell)
exponent = 5.0          # superellipse exponent n (4 = rounder, 6 = squarer)
filled_scale = 1.05     # "filled" icons: square art is scaled to 105% of the plate, then clipped
logo_size = 0.72        # "logo" icons: longest side of the logo as a fraction of the plate
rim_width = 1.0         # hairline rim width in pixels at 128 px and below (scales up above that)
rim_top_alpha = 0.34    # rim: white at 34% at the top ...
rim_bottom_alpha = 0.05 # ... fading to 5% at the bottom
shadow_opacity = 0.28   # contact shadow under "logo" icons

[colors]
plate_top = "#FCF9F2"
plate_bottom = "#EEE8DC"
terminal_top = "#6A305A"
terminal_bottom = "#3A1A38"

# Per-app overrides. Key = icon name or desktop id (without .desktop).
# Short form:   "org.gnome.Maps" = "logo"         (filled | logo | terminal | art)
#   art = finished drawing from art/<icon name>.svg (made by tools/make-art.py)
# Long form:    [overrides."firefox_firefox"]
#               style = "logo"
#               logo_size = 0.8                   (any [shape] key)
#               icon = "~/Pictures/my-firefox.svg" (use a different source image)
#               background = "#FFFFFF"            (filled icons: colour behind clipped corners)
#               plate_top = "#7C7B82"             (logo icons: plate colour, top ...)
#               plate_bottom = "#46454C"          (... and bottom)
#               rim_top_alpha = 0.45              (this icon's rim brightness, top / bottom)
#               rim_bottom_alpha = 0.18
#               plate_checker = ["#D8B48A", "#A97D56"]  (a board pattern instead of a gradient)
#               checker_size = 4
[overrides]
# Your picks (9 Nov 2026): Yaru's own drawing filling the squircle ...
"org.gnome.Maps" = "art"
"org.gnome.Showtime" = "art"
"org.gnome.Papers" = "art"
"org.gnome.Loupe" = "art"
"preferences-desktop-locale" = "art"
"org.gnome.Yelp" = "art"
"org.gnome.DejaDup" = "art"
"com.github.unrud.VideoDownloader" = "art"
"org.gnome.Contacts" = "art"
"haru-snap-store_snap-store" = "art"
"org.gnome.TextEditor" = "art"
"org.gnome.SimpleScan" = "art"
"nvidia-settings" = "art"
"io.github.zaedus.spider" = "art"
"org.gnome.Logs" = "art"
"io.gitlab.metadatacleaner.metadatacleaner" = "art"
"org.gnome.design.AppIconPreview" = "art"
"org.gnome.Adwaita1.Demo" = "art"

# Plates (rule agreed 10 Nov 2026, like Apple):
